[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speakersync"
version = "0.1.0"
description = "Dual-speaker Bluetooth time alignment and Focus/Impact audio routing for immersive movies and music"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SpeakerSync Team" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "matplotlib>=3.8.0",
    "sounddevice>=0.4.6",
    "pyyaml>=6.0.1",
    "typer>=0.9.0",
    "imageio-ffmpeg>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
speakersync = "speakersync.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
